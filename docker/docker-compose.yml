version: '3.8'

services:
  # 1. PostgreSQL - Metadata, user accounts, and audit logs
  postgres:
    image: postgres:16-alpine
    container_name: legal_ai_postgres
    environment:
      POSTGRES_DB: legal_ai_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - legal_ai_network

  # 2. Redis - Caching and Celery Task Queue Broker
  redis:
    image: redis:7-alpine
    container_name: legal_ai_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - legal_ai_network

  # 3. Neo4j - Knowledge Graph for Legal Clauses & Statutes
  neo4j:
    image: neo4j:5.20-community
    container_name: legal_ai_neo4j
    environment:
      NEO4J_AUTH: neo4j/legalpassword123
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474" # HTTP Browser
      - "7687:7687" # Bolt Protocol
    volumes:
      - neo4j_data:/data
    networks:
      - legal_ai_network

  # 4. Qdrant / Milvus - Vector Search for Hybrid RAG
  vector_db:
    image: qdrant/qdrant:v1.9.0
    container_name: legal_ai_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - legal_ai_network

  # 5. MinIO - S3-compatible Object Storage for PDF files
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: legal_ai_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: miniopassword123
    ports:
      - "9000:9000" # API
      - "9001:9001" # Web UI Console
    volumes:
      - minio_data:/data
    networks:
      - legal_ai_network

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  qdrant_data:
  minio_data:

networks:
  legal_ai_network:
    driver: bridge
